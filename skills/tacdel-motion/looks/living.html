  chat(cX, 1080 + bob, 270, { lx: t > S(28) && t < S(30) ? .7 : .5, ly: -.4, belt: hasT, happy: t > S(30) + .6 && t < S(33), arms: t > S(28) && t < S(30) ? [[.5, 0, .82, -.3]] : null });
  tac(tX, 1090 + Math.sin(t * 3 + 1) * 6, 270, { lx: -.5, ly: -.4, belt: true, happy: t > S(32) + .3 && t < S(33) + .3, squint: false });
  txt('tacdel', 540, 1370, 34, 'rgba(238,242,255,.7)', 'center', 900, clamp((t - S(35) - .2) / .4));
}

/* ---------- captions (tacdel-shorts style) ---------- */
function captions(t) {
  if (!CAP_ON) return; const c = CAPS.find((c, i) => t >= c[1] && t < Math.max(c[2] + .25, (CAPS[i + 1] || [0, 1e9])[1] - .02) && t < c[2] + .7); if (!c) return;
  ctx.save(); ctx.font = `700 46px ${SANS}`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.letterSpacing = '0px';
  const words = c[0].split(' '), lines = []; let cur = '';
  for (const w of words) { const tr = cur ? cur + ' ' + w : w; if (ctx.measureText(tr).width > 820 && cur) { lines.push(cur); cur = w; } else cur = tr; } lines.push(cur);
  const lh = 60, h = lines.length * lh + 34, w = Math.max(...lines.map(l => ctx.measureText(l).width)) + 64, y0 = 1520 - h / 2;
  ctx.fillStyle = 'rgba(8,8,8,.82)'; ctx.beginPath(); ctx.roundRect(540 - w / 2, y0, w, h, 28); ctx.fill();
  ctx.fillStyle = '#ffffff'; lines.forEach((l, i) => ctx.fillText(l, 540, y0 + 17 + lh / 2 + i * lh)); ctx.restore();
}

/* ---------- frame ---------- */
function draw(traw) {
  const t = warp(traw);
  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over'; ctx.setLineDash([]); ctx.shadowColor = 'transparent';
  const bg = ctx.createRadialGradient(540, 860, 80, 540, 900, 1300); bg.addColorStop(0, '#1b2a58'); bg.addColorStop(1, '#060914'); ctx.fillStyle = bg; ctx.fillRect(0, 0, W, H); bokeh(t);
  if (t < F3 + .05) scenePanels(t);
  if (t > F3 - .05) { ctx.save(); ctx.globalAlpha = clamp((t - F3 + .05) / .3); sceneMerged(t); ctx.restore(); }
  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.globalAlpha = 1;
  // "Except": the room freezes and loses colour for a beat
  const fr = t > S(9) - .08 && t < S(10) + .4 ? (1 - clamp((t - S(10)) / .4)) : 0; if (fr > 0) { ctx.save(); ctx.globalAlpha = fr * .35; ctx.globalCompositeOperation = 'saturation'; ctx.fillStyle = '#808080'; ctx.fillRect(0, 0, W, H); ctx.restore(); }
  const f = clamp((t - (PAGE_END - .35)) / .35); if (f > 0) { ctx.globalAlpha = f; ctx.fillStyle = '#060914'; ctx.fillRect(0, 0, W, H); ctx.globalAlpha = 1; }
  captions(t);
  if (PENDING) { ctx.save(); ctx.font = `700 26px ${SANS}`; ctx.fillStyle = 'rgba(8,8,8,.7)'; ctx.beginPath(); ctx.roundRect(24, 150, 640, 44, 22); ctx.fill(); ctx.fillStyle = '#fff'; ctx.textBaseline = 'middle'; ctx.fillText('REVIEW COPY · voice pending · timing estimated', 44, 173); ctx.restore(); }
}

/* ---------- player (works with tools/sheet.cjs and tools/render.cjs) ---------- */
let T = Q.has('t') ? clamp(+Q.get('t'), 0, DUR - .001) : 0, playing = !Q.has('t'), prev = null;
function frame(now) { if (playing && prev !== null) T = (T + Math.min(.1, (now - prev) / 1000)) % DUR; prev = now; draw(T); requestAnimationFrame(frame); }
addEventListener('keydown', e => { if (e.key === ' ') { playing = !playing; e.preventDefault(); } else if (e.key.toLowerCase() === 'r') { T = 0; playing = true; } });
cv.onclick = () => { playing = !playing; };
window.seek = s => { T = s; playing = false; draw(T); };
requestAnimationFrame(frame);
</script>
</body>
