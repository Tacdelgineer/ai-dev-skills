/* ---------- scene E: one manager, four teams, a checker; then quiet; then a website and the plan ---------- */
const BLUE = [540, 612], BW = 600, BH = 296, TILES = [['HEADER', 'o'], ['MENU', 'c'], ['CONTENT', 'oc'], ['FOOTER', 'o']];
const tileRect = k => [[0, 0, 1, .2], [0, .2, .26, .8], [.26, .2, .74, .62], [.26, .82, .74, .18]][k];

  const mapA = 1 - eio((t - S(25)) / .45);

  SPL.forEach(sp => print(SH.splat, sp.x, sp.y + (1 - mapA) * 40, sp.s, sp.s * .85, sp.rot, sp.ink, .92 * mapA));

    print(SH.burst, 0, 0, 2.3, 1.3, 0, 'o'); ctx.restore(); printText('TWEET!', 790, 322, 70, clamp(a, 0, 1)); }

  if (lineP > 0 && fadeE > 0) { ctx.save(); ctx.globalAlpha = fadeE; ctx.globalCompositeOperation = 'multiply'; ctx.strokeStyle = CYAN; ctx.lineWidth = 9; ctx.setLineDash([20, 14]); ctx.lineDashOffset = -t * 30;
    TEAMX.forEach(x => { ctx.beginPath(); ctx.moveTo(MAN[0], MAN[1] + 70); ctx.lineTo(lerp(MAN[0], x, lineP), lerp(MAN[1] + 70, 650, lineP)); ctx.stroke(); }); ctx.restore(); }

  const bpA = back((t - S(25) - .25) / .45), split = t > S(25) + 1.0;
  if (t > S(25) + .2 && !split) { ctx.save(); ctx.translate(BLUE[0], BLUE[1]); ctx.scale(bpA * .75, bpA * .75); wire(1, false); ctx.restore(); }

    const up = eio((t - S(30) - .35 - k * .15) / .55); const [fx, fy, fw, fh] = tileRect(k);
    if (up > 0) { x = lerp(x, BLUE[0] - BW / 2 + (fx + fw / 2) * BW, up); y = lerp(y, BLUE[1] - BH / 2 + (fy + fh / 2) * BH, up) - Math.sin(up * Math.PI) * 120; w = lerp(w, fw * BW - 10, up); h = lerp(h, fh * BH - 10, up); }
    tile(x, y, w, h, n, ink, 1 - up * .0); });
  // finished site + LIVE
  if (t > S(30) + .3 && t < S(32) + .6) { const a = clamp((t - S(30) - .3) / .3) * fadeE; ctx.save(); ctx.globalAlpha = a; ctx.translate(BLUE[0], BLUE[1]); wire(1, true, t > S(30) + 1.4); ctx.restore();
    if (t > S(30) + 1.4) TILES.forEach(([n, ink], k) => { const [fx, fy, fw, fh] = tileRect(k); ctx.save(); ctx.globalAlpha = fadeE; tile(BLUE[0] - BW / 2 + (fx + fw / 2) * BW, BLUE[1] - BH / 2 + (fy + fh / 2) * BH, fw * BW - 10, fh * BH - 10, n, ink, 1); ctx.restore(); });
    ctx.save(); ctx.globalAlpha = fadeE; stampMark('LIVE', 760, 500, 64, -.18, (t - S(31) - .2) / .5); ctx.restore(); }
  // the afternoon sun
  if (t > S(30) - .2) { const a = clamp((t - S(30) + .2) / .4) * fadeE; print(SH.star, 905, 320 - eo((t - S(30)) / 1.5) * 40, .7, .7, t * .6, 'o', a); }
  // conveyor + checker
  const cvA = eo((t - S(27) + .15) / .4) * fadeE;
  if (cvA > 0) { ctx.save(); ctx.globalAlpha = cvA; ctx.translate(-(1 - cvA) * 300, 0); card(40, 1172, 860, 46, 23, 'c', { light: true });
    ctx.save(); ctx.globalCompositeOperation = 'multiply'; ctx.fillStyle = CYAN; const sp = t < S(28) ? t * 420 : S(28) * 420 + (t - S(28)) * 260;
    for (let x = 60 + (sp % 60); x < 890; x += 60) { ctx.beginPath(); ctx.arc(x, 1195, 11, 0, 7); ctx.fill(); } ctx.restore(); ctx.restore();
    ITEMS.forEach(it => { if (t < it.tb) return; const cx = TEAMX[it.j]; let x, y, a = 1, sc = 1; const drop = clamp((t - it.tb) / .28);
      if (t < it.ta) { x = cx + (t - it.tb - .28 > 0 ? (t - it.tb - .28) * 420 : 0); y = lerp(990, 1150, drop * drop); }
      else if (it.bad) { const b = clamp((t - it.ta) / .7); x = lerp(880, cx, b); y = 1150 - Math.sin(b * Math.PI) * 260; a = 1 - clamp((b - .85) / .15); }
      else { const b = clamp((t - it.ta - .25) / .45); x = lerp(880, 930, b); y = lerp(1150, 1030, b); sc = 1 - b * .6; a = 1 - b; }
      if (a <= 0) return; ctx.save(); ctx.globalAlpha = a * cvA; tile(x, y, 96 * sc, 58 * sc, '', TILES[it.j][1], 1, true); ctx.restore();
      if (t > it.ta && t < it.ta + .5) { if (it.bad) printText('✗', 880, 1080, 70, 1 - clamp((t - it.ta) / .5)); else printText('✓', 880, 1080, 70, 1 - clamp((t - it.ta - .25) / .25)); } }); }

  const st = []; for (let i = 0; i < NB; i++) st.push([i, stateE(i, t)]);
  st.sort((a, b) => (a[0] === 0) - (b[0] === 0) || a[1].y - b[1].y);
  const calm = clamp((t - S(28)) / .4);

    let lx = Math.sin(t * 1.3 + i * 1.7) * .5 * (1 - calm), ly = Math.cos(t * 1.1 + i * 2.3) * .4 * (1 - calm), prop = null;

    if (s.frozen && [3, 9, 17, 22, 31, 44, 58, 71].includes(i)) { const q = back((t - S(23) - .1 - (i % 5) * .05) / .25) * (1 - clamp((t - S(24) - .2) / .3)); if (q > 0) printText('!', s.x, s.y - s.s * .8, 54 * clamp(q, 0, 1.3), 1); }
  });
  ctx.restore();

  if (t > S(32) + .3) { const a = clamp((t - S(32) - .3) / .5); ctx.save(); ctx.globalAlpha = a; ctx.globalCompositeOperation = 'multiply'; ctx.fillStyle = pat(P.cL); ctx.beginPath(); ctx.roundRect(268, 488, 544, 744, 30); ctx.fill(); ctx.restore();
    printText('THE PLAN', 540, 640 + (1 - eo((t - S(34) + .15) / .4)) * 20, 96, eo((t - S(34) + .15) / .4));
    [760, 930, 1100].forEach((y, k) => { const p = eo((t - S(34) + .05 - k * .18) / .35); if (p > 0) { ctx.save(); ctx.globalCompositeOperation = 'multiply'; ctx.fillStyle = pat(P.o); ctx.fillRect(450, y - 12, 330 * p, 24); ctx.fillStyle = ORANGE; ctx.fillRect(450, y - 6, 300 * p, 12); ctx.restore(); } });
    label('tacdel', 540, 1340, 40, DARK, 'center', 900, clamp((t - S(33)) / .4)); }
}
function stateE(i, t) {

  else { const r0 = S(25) + DL2[i], u = eio((t - r0) / .8), T2 = TEAMP[i]; x = lerp(x, T2[0], u); y = lerp(y, T2[1], u) - Math.sin(clamp((t - r0) / .8) * Math.PI) * 70; s = lerp(s, T2[2], u); team = u >= 1; }
  if (t > S(32)) { const r1 = S(32) + .05 + DL2[i] * .7, u = eio((t - r1) / .8), Cl = i === 0 ? [540, 425, 132] : CLIP[i];
    x = lerp(x, Cl[0], u); y = lerp(y, Cl[1], u) - Math.sin(clamp((t - r1) / .8) * Math.PI) * 50; s = lerp(s, Cl[2], u); team = false; }

}
function wire(sc, built, full) { // website blueprint / browser frame (centered on origin)

  if (!built) TILES.forEach(([n], k) => { const [rx, ry, rw, rh] = tileRect(k); card(-BW / 2 + rx * BW + 8, -BH / 2 + ry * BH + 8, rw * BW - 16, rh * BH - 16, 10, 'c', { fill: false, noShadow: true, stroke: CYAN, lw: 5, dash: [12, 10] });

function tile(x, y, w, h, n, ink, a = 1, mini = false) { if (w < 2 || h < 2) return; ctx.save(); ctx.globalAlpha *= a;

  if (n && w > 90) label(n, x, y + Math.min(h, 60) * .18, Math.min(26, h * .45), ink === 'oc' ? DARK : PAPER, 'center', 900); ctx.restore(); }

/* ---------- ink wipe between scenes ---------- */

  ctx.beginPath(); ctx.moveTo(xL + 2200, 0); ctx.lineTo(xL + 2260, 0); ctx.lineTo(xL + 1760, H); ctx.lineTo(xL + 1700, H); ctx.closePath(); ctx.fillStyle = ORANGE; ctx.fill(); ctx.restore(); }

/* ---------- captions (tacdel-shorts style) ---------- */
function captions(t) {

  ctx.fillStyle = 'rgba(8,8,8,.82)'; ctx.beginPath(); ctx.roundRect(540 - w / 2, y0, w, h, 28); ctx.fill();

/* ---------- frame ---------- */
function draw(traw) {

}

/* ---------- player (works with tools/sheet.cjs and tools/render.cjs) ---------- */
let T = Q.has('t') ? clamp(+Q.get('t'), 0, DUR - .001) : 0, playing = !Q.has('t'), prev = null;
function frame(now) { if (playing && prev !== null) T = (T + Math.min(.1, (now - prev) / 1000)) % DUR; prev = now; draw(T); requestAnimationFrame(frame); }
addEventListener('keydown', e => { if (e.key === ' ') { playing = !playing; e.preventDefault(); } else if (e.key.toLowerCase() === 'r') { T = 0; playing = true; } });

requestAnimationFrame(frame);
