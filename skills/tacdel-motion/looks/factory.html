    if (t < S(3)) { for (let k = 0; k < 5; k++) { const y = .42 + k * .2 - ((t * .3) % .2), g = k === 3 && t > S(2) - .1; ctx.fillStyle = g ? '#8fe3b0' : (k % 2 ? '#4fb3d9' : '#f4efe6'); ctx.beginPath(); ctx.roundRect(k % 2 ? .3 : .8, y, .9, .12, .06); ctx.fill(); } }

  const f = clamp((t - (PAGE_END - .35)) / .35); if (f > 0) { ctx.globalAlpha = f; ctx.fillStyle = '#f3e3d3'; ctx.fillRect(0, 0, W, H); ctx.globalAlpha = 1; }
  captions(t);
  if (PENDING) { ctx.save(); ctx.font = `700 26px ${SANS}`; ctx.fillStyle = 'rgba(8,8,8,.7)'; ctx.beginPath(); ctx.roundRect(24, 150, 640, 44, 22); ctx.fill(); ctx.fillStyle = '#fff'; ctx.textBaseline = 'middle'; ctx.fillText('REVIEW COPY · voice pending · timing estimated', 44, 173); ctx.restore(); }
}

/* ---------- player (works with tools/sheet.cjs and tools/render.cjs) ---------- */
let T = Q.has('t') ? clamp(+Q.get('t'), 0, DUR - .001) : 0, playing = !Q.has('t'), prev = null;
function frame(now) { if (playing && prev !== null) T = (T + Math.min(.1, (now - prev) / 1000)) % DUR; prev = now; draw(T); requestAnimationFrame(frame); }
addEventListener('keydown', e => { if (e.key === ' ') { playing = !playing; e.preventDefault(); } else if (e.key.toLowerCase() === 'r') { T = 0; playing = true; } });
cv.onclick = () => { playing = !playing; };
window.seek = s => { T = s; playing = false; draw(T); };
requestAnimationFrame(frame);
</script>
