<!--

  Look: black board, white chalk lines that draw themselves on, hand-sketched, black and white only.
  Timed to one eleven_v4 take (voice.mp3 + words.json from tacdel-motion/tools/voice.py).

<script>
const TITLE = 'I took my AI for a walk · chalkboard';
const CAPS = [
  ['Can you take an AI for a walk?', 0.0, 2.0],
  ['I tried.', 2.24, 3.12],
  ['In a Stanford study,', 3.36, 4.64],
  ['walking made 81% of people more creative.', 4.84, 7.92],
  ['Even on a treadmill,', 8.0, 9.12],
  ['facing a blank wall.', 9.16, 10.72],
  ['Walking gets ideas flowing.', 10.96, 12.88],
  ['My AI can’t walk,', 13.2, 14.64],

  ['A barking dog.', 16.48, 17.76],
  ['A bakery smell.', 17.84, 19.12],

  ['10 without.', 27.0, 27.84],
  ['Another AI scored every idea blind.', 28.08, 30.72],

  ['With it: 3.0.', 33.92, 35.68],

  ['36 versus 22.', 39.96, 42.0],

  ['It made it repeat itself less.', 44.64, 46.64],
];
const SCENES = [0, at0(2), at0(7), at0(12), at0(17), at0(20), at0(22)], DUR = 47.9;
function at0(i) { return CAPS[i][1]; }
// re-timing to a new voice take: [[time in the new take, time these scenes were written for], ...]; empty = none
const WARP = [];
const warp = t => { if (WARP.length < 2) return t; let i = 0; while (i < WARP.length - 2 && t > WARP[i + 1][0]) i++;
  const [a0, b0] = WARP[i], [a1, b1] = WARP[i + 1]; return b0 + (t - a0) * (b1 - b0) / (a1 - a0); };
const W = 1080, H = 1920;
const SANS = '"Inter","Helvetica Neue","Segoe UI",Arial,sans-serif';

/* ---------- chalkboard helpers (black board, white chalk that draws itself on) ---------- */
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x)), lerp = (a, b, u) => a + (b - a) * u;
const eo = u => 1 - Math.pow(1 - clamp(u), 3), e5 = u => 1 - Math.pow(1 - clamp(u), 5);
const back = u => { u = clamp(u); const c = 1.8; return 1 + (c + 1) * Math.pow(u - 1, 3) + c * Math.pow(u - 1, 2); };
const sceneAt = t => { let i = 0; while (i < SCENES.length - 1 && t >= SCENES[i + 1]) i++; return i; };
const at = at0;                       // start time of caption chunk i (cue words)
let T = 0;
const C = { board: '#121312', chalk: '#f1f0ea', dim: 'rgba(241,240,234,.55)', faint: 'rgba(241,240,234,.28)' };
const HAND = '"Cabin Sketch","Patrick Hand","Comic Sans MS",cursive', NOTE = '"Patrick Hand","Comic Sans MS",cursive';
const hash = (a, b = 0, c = 0) => { let h = Math.imul(a | 0, 374761393) ^ Math.imul(b | 0, 668265263) ^ Math.imul(c | 0, 2147483647); h = Math.imul(h ^ (h >>> 13), 1274126177); return ((h ^ (h >>> 16)) >>> 0) / 4294967296; };
const boil = () => Math.floor(T * 8) % 3;         // lines re-sketch slightly, 8 times a second

// the chalk layer: everything chalk is drawn here, then grain is cut out of it, then it goes on the board
const L = document.createElement('canvas'); L.width = W; L.height = H; const lx = L.getContext('2d');
const GRAIN = document.createElement('canvas'); GRAIN.width = W; GRAIN.height = H;
const BOARD = document.createElement('canvas'); BOARD.width = W; BOARD.height = H;
(function textures() {
  const g = GRAIN.getContext('2d'); let s = 7;
  const r = () => (s = (Math.imul(s, 1103515245) + 12345) >>> 0) / 4294967296;
  for (let k = 0; k < 260000; k++) { g.fillStyle = `rgba(0,0,0,${.25 + r() * .7})`; g.fillRect(r() * W, r() * H, 1 + r() * 2, 1 + r() * 1.6); }
  const b = BOARD.getContext('2d'); b.fillStyle = C.board; b.fillRect(0, 0, W, H);
  for (let k = 0; k < 14; k++) { const x = r() * W, y = r() * H, rr = 200 + r() * 420, gr = b.createRadialGradient(x, y, 0, x, y, rr);
    gr.addColorStop(0, `rgba(241,240,234,${.018 + r() * .03})`); gr.addColorStop(1, 'rgba(241,240,234,0)'); b.fillStyle = gr; b.fillRect(0, 0, W, H); }
  b.lineCap = 'round';
  for (let k = 0; k < 7; k++) { const y = r() * H, x = r() * W; b.strokeStyle = `rgba(241,240,234,${.008 + r() * .01})`; b.lineWidth = 60 + r() * 90;
    b.beginPath(); b.moveTo(x - 300, y); b.quadraticCurveTo(x, y - 60 + r() * 120, x + 300 + r() * 200, y + r() * 40); b.stroke(); }
  for (let k = 0; k < 9000; k++) { b.fillStyle = `rgba(241,240,234,${r() * .07})`; b.fillRect(r() * W, r() * H, 1.5, 1.5); }
})();

// paths are arrays of [x,y]; densify so we can draw any fraction of them by length
function dens(pts, step = 7) {
  const out = [pts[0]];
  for (let i = 1; i < pts.length; i++) { const [a, b] = [pts[i - 1], pts[i]], d = Math.hypot(b[0] - a[0], b[1] - a[1]), n = Math.max(1, Math.round(d / step));
    for (let k = 1; k <= n; k++) out.push([lerp(a[0], b[0], k / n), lerp(a[1], b[1], k / n)]); }
  return out;
}
const plen = pts => { let s = 0; for (let i = 1; i < pts.length; i++) s += Math.hypot(pts[i][0] - pts[i - 1][0], pts[i][1] - pts[i - 1][1]); return s; };
// one chalk stroke, drawn on up to fraction p; three rough passes give the dusty edge
function stroke(pts, p = 1, o = {}) {
  if (p <= 0 || pts.length < 2) return; const d = dens(pts), n = Math.max(2, Math.ceil(d.length * clamp(p))), w = o.w || 7, a = o.a ?? 1, seed = o.seed || 1, bo = boil();
  lx.save(); lx.lineCap = 'round'; lx.lineJoin = 'round'; lx.strokeStyle = o.col || C.chalk;
  for (let pass = 0; pass < 3; pass++) {
    lx.globalAlpha = a * [.85, .45, .3][pass]; lx.lineWidth = w * [1, .7, 1.25][pass]; lx.beginPath();
    for (let i = 0; i < n; i++) { const j = (o.jit ?? 1.6) * (pass ? 1.6 : 1); const x = d[i][0] + (hash(i, seed + pass * 31, bo) - .5) * j, y = d[i][1] + (hash(i, seed + pass * 57 + 9, bo) - .5) * j;
      i ? lx.lineTo(x, y) : lx.moveTo(x, y); }
    lx.stroke();
  }
  if (p < 1 && !o.noTip) { const e = d[n - 1]; lx.globalAlpha = a; lx.fillStyle = C.chalk; lx.beginPath(); lx.arc(e[0], e[1], w * .9, 0, 7); lx.fill(); }
  lx.restore();
}
// a set of strokes drawn one after another, sharing one progress value (by length)
function sketch(paths, p, o = {}) {
  if (p <= 0) return; const lens = paths.map(plen), tot = lens.reduce((a, b) => a + b, 0) || 1; let acc = 0;
  paths.forEach((pt, i) => { const s = acc / tot, e = (acc + lens[i]) / tot; acc += lens[i]; stroke(pt, (clamp(p) - s) / (e - s || 1), { ...o, seed: (o.seed || 1) + i * 13, noTip: o.noTip || p >= 1 }); });
}
// shape makers (hand-drawn: slight bows and overshoot)
const ln = (x1, y1, x2, y2, bow = 4, seed = 1) => { const mx = (x1 + x2) / 2, my = (y1 + y2) / 2, dx = x2 - x1, dy = y2 - y1, L0 = Math.hypot(dx, dy) || 1, b = (hash(seed, 3) - .5) * bow * 2;
  const pts = []; for (let k = 0; k <= 12; k++) { const u = k / 12, s = Math.sin(u * Math.PI) * b; pts.push([lerp(x1, x2, u) - dy / L0 * s, lerp(y1, y2, u) + dx / L0 * s]); } return pts; };
const circ = (cx, cy, rx, ry = rx, a0 = -Math.PI * .6, sweep = Math.PI * 2.12, seed = 1) => { const pts = [], n = Math.max(16, Math.round((rx + ry) * .35));
  for (let k = 0; k <= n; k++) { const a = a0 + sweep * k / n, wob = 1 + (hash(seed, k >> 2) - .5) * .05; pts.push([cx + Math.cos(a) * rx * wob, cy + Math.sin(a) * ry * wob]); } return pts; };
const box = (x, y, w, h, seed = 1) => [ln(x - 4, y, x + w + 6, y, 3, seed), ln(x + w, y - 4, x + w, y + h + 5, 3, seed + 1), ln(x + w + 4, y + h, x - 5, y + h, 3, seed + 2), ln(x, y + h + 3, x, y - 5, 3, seed + 3)];
const curve = (pts, n = 40) => { const out = []; for (let i = 0; i < pts.length - 1; i++) { const p0 = pts[Math.max(0, i - 1)], p1 = pts[i], p2 = pts[i + 1], p3 = pts[Math.min(pts.length - 1, i + 2)];
  for (let k = 0; k < n; k++) { const u = k / n, u2 = u * u, u3 = u2 * u; out.push([0, 1].map(j => .5 * (2 * p1[j] + (-p0[j] + p2[j]) * u + (2 * p0[j] - 5 * p1[j] + 4 * p2[j] - p3[j]) * u2 + (-p0[j] + 3 * p1[j] - 3 * p2[j] + p3[j]) * u3))); } }
  out.push(pts[pts.length - 1]); return out; };
const wave = (x, y, w, amp = 8, n = 3) => { const pts = []; for (let k = 0; k <= 40; k++) pts.push([x + w * k / 40, y + Math.sin(k / 40 * Math.PI * 2 * n) * amp]); return pts; };
const tf = (paths, dx, dy, s = 1) => paths.map(p => p.map(([x, y]) => [dx + x * s, dy + y * s]));

// chalk writing: letters appear left to right like a hand writing them
function write(s, x, y, size, p, o = {}) {
  if (p <= 0) return; lx.save(); lx.font = `${o.wt || 700} ${size}px ${o.font || HAND}`; lx.textAlign = o.align || 'left'; lx.textBaseline = 'alphabetic';
  const w = lx.measureText(s).width, x0 = o.align === 'center' ? x - w / 2 : o.align === 'right' ? x - w : x;
  lx.beginPath(); lx.rect(x0 - 10, y - size * 1.1, (w + 20) * clamp(p), size * 1.5); lx.clip();
  lx.globalAlpha = o.a ?? 1; lx.fillStyle = o.col || C.chalk; lx.fillText(s, x, y);
  lx.globalAlpha = (o.a ?? 1) * .35; lx.fillText(s, x + 1.5, y - 1); lx.restore();
}
const textW = (s, size, o = {}) => { lx.save(); lx.font = `${o.wt || 700} ${size}px ${o.font || HAND}`; const w = lx.measureText(s).width; lx.restore(); return w; };
const fitSize = (s, width, max = 200, o = {}) => Math.min(max, 100 * width / textW(s, 100, o));
// hatched fill (chalk shading) for bars; drawn on bottom to top
function hatch(x, y, w, h, p, gap = 16, seed = 1) { if (p <= 0) return; const paths = []; for (let k = -w; k < h; k += gap) { const y1 = y + h - k, x2 = x + w;
  const a = [x, y1], b = [x2, y1 - w]; // 45 degree line clipped to the box
  const cl = ([px, py]) => [px, py]; paths.push([cl(a), cl(b)]); }
  lx.save(); lx.beginPath(); lx.rect(x, y + h - h * clamp(p), w, h * clamp(p)); lx.clip(); paths.forEach((pt, i) => stroke(pt, 1, { w: 4, a: .7, seed: seed + i, noTip: true })); lx.restore(); }

/* ---------- Tac in chalk: the one-eyed robot ---------- */
function tac(x, y, s, o = {}) { // (x,y) = feet; o.p draw-on progress, o.walk leg phase, o.look eye offset, o.leash
  const p = o.p ?? 1, ph = o.walk ?? 0, sw = Math.sin(ph) * .45, bob = Math.abs(Math.cos(ph)) * 6 * s * (o.walk !== undefined ? 1 : 0);
  const X = v => x + v * s, Y = v => y - bob + v * s;
  const legs = [[[X(-18), Y(-70)], [X(-18 + Math.sin(sw) * 60), Y(-70 + Math.cos(sw) * 70)]], [[X(18), Y(-70)], [X(18 - Math.sin(sw) * 60), Y(-70 + Math.cos(sw) * 70)]]];
  const body = box(X(-45), Y(-160), 90 * s, 90 * s, 5), head = box(X(-62), Y(-275), 124 * s, 100 * s, 9);
  const eye = circ(X(0), Y(-225), 30 * s, 30 * s, -1.9, Math.PI * 2.1, 3);
  const arms = [ln(X(-45), Y(-140), X(-80), Y(-95 + Math.sin(ph + 1) * 10), 3, 11), ln(X(45), Y(-140), X(80), Y(-95 - Math.sin(ph + 1) * 10), 3, 12)];
  const ant = [ln(X(0), Y(-275), X(0), Y(-315), 2, 13), circ(X(0), Y(-325), 10 * s, 10 * s, 0, Math.PI * 2.1, 4)];
  sketch([...head, eye, ...ant, ...body, ...arms, ...legs], p, { w: 7 * Math.max(.7, s), seed: 40 });
  if (p > .6) { const lk = o.look || [0, 0]; lx.save(); lx.globalAlpha = clamp((p - .6) / .2); lx.fillStyle = C.chalk; lx.beginPath(); lx.arc(X(lk[0] * 12), Y(-225 + lk[1] * 12), 11 * s, 0, 7); lx.fill(); lx.restore(); }
  if (o.leash) stroke(curve([[X(-60), Y(-150)], ...o.leash]), o.leashP ?? 1, { w: 5, seed: 77 });
  return { neck: [X(-45), Y(-150)], top: [X(0), Y(-330)] };
}

/* ---------- street sights: quick chalk sketches, ~ 200 px, origin top-left ---------- */
const SIGHT = {
  dog: () => [circ(70, 90, 55, 28, 0, Math.PI * 2.1, 2), circ(140, 55, 26, 24, 0, Math.PI * 2.1, 3), ln(150, 40, 172, 28, 2, 1), ln(40, 112, 34, 150), ln(62, 116, 60, 150), ln(92, 116, 96, 150), ln(112, 110, 118, 150), curve([[16, 84], [0, 58], [6, 40]])],
  neon: () => [...box(10, 30, 190, 90, 6), ln(60, 0, 70, 30, 2, 2), ln(150, 0, 140, 30, 2, 3), curve([[120, 30], [128, 62], [116, 84], [126, 120]], 12)],
  bread: () => [curve([[10, 120], [30, 70], [100, 60], [180, 70], [200, 120], [10, 120]], 14), ln(60, 82, 74, 108), ln(100, 76, 114, 104), ln(140, 80, 152, 106),
    curve([[70, 50], [60, 30], [76, 12], [64, -10]], 10), curve([[110, 44], [100, 24], [116, 6], [104, -16]], 10), curve([[150, 50], [140, 30], [156, 12], [144, -10]], 10)],
  chalkart: () => [circ(50, 50, 30, 30, 0, Math.PI * 2.1, 5), ...[0, 1, 2, 3, 4, 5, 6, 7].map(k => { const a = k * Math.PI / 4; return ln(50 + Math.cos(a) * 40, 50 + Math.sin(a) * 40, 50 + Math.cos(a) * 58, 50 + Math.sin(a) * 58, 1, k); }),
    ...box(110, 70, 90, 70, 7), ln(102, 72, 155, 30, 2, 8), ln(155, 30, 208, 72, 2, 9), ...box(145, 108, 22, 32, 10)],
  gutter: () => [ln(0, 40, 210, 40), ln(0, 40, 0, 70), wave(10, 90, 190, 7, 4), wave(30, 118, 160, 6, 3), wave(60, 142, 110, 5, 2), ...box(80, 60, 60, 24, 4), ln(95, 60, 95, 84, 1, 4), ln(110, 60, 110, 84, 1, 5), ln(125, 60, 125, 84, 1, 6)],
  bus: () => [...box(0, 20, 210, 110, 8), ...box(16, 36, 40, 34, 9), ...box(66, 36, 40, 34, 10), ...box(116, 36, 80, 50, 11), circ(50, 132, 18, 18, 0, Math.PI * 2.1, 6), circ(160, 132, 18, 18, 0, Math.PI * 2.1, 7)],
};


/* ---------- scenes (each draws chalk onto the layer lx; cue times come from CAPS) ---------- */
const MODELS = 'ideas: qwen3.6:35b-a3b · judge: glm4 (9B) · 10 + 10 runs';
function note(s, x, y, size, p, o = {}) { write(s, x, y, size, p, { font: NOTE, wt: 400, ...o }); }
function along(pts, u) { // point + direction at fraction u of a polyline's length
  const d = dens(pts, 4), tot = plen(d); let goal = clamp(u) * tot, acc = 0;
  for (let i = 1; i < d.length; i++) { const sl = Math.hypot(d[i][0] - d[i - 1][0], d[i][1] - d[i - 1][1]); if (acc + sl >= goal) { const k = (goal - acc) / (sl || 1); return [lerp(d[i - 1][0], d[i][0], k), lerp(d[i - 1][1], d[i][1], k), Math.sign(d[i][0] - d[i - 1][0])]; } acc += sl; }
  const e = d[d.length - 1]; return [e[0], e[1], 1];
}
function bulb(x, y, s, p) { sketch([circ(x, y, 22 * s, 24 * s, Math.PI * .75, Math.PI * 1.55, 2), ln(x - 10 * s, y + 20 * s, x - 10 * s, y + 36 * s, 1, 3), ln(x + 10 * s, y + 20 * s, x + 10 * s, y + 36 * s, 1, 4), ln(x - 10 * s, y + 36 * s, x + 10 * s, y + 36 * s, 1, 5),
  ln(x, y - 34 * s, x, y - 46 * s, 1, 6), ln(x - 28 * s, y - 20 * s, x - 38 * s, y - 28 * s, 1, 7), ln(x + 28 * s, y - 20 * s, x + 38 * s, y - 28 * s, 1, 8)], p, { w: 5 }); }
function tally(x, y, n, p, seed = 1) { const paths = []; for (let k = 0; k < n; k++) { const g = Math.floor(k / 5), j = k % 5, gx = x + g * 150;
  paths.push(j < 4 ? ln(gx + j * 26, y, gx + j * 26 + 4, y + 90, 2, seed + k) : ln(gx - 12, y + 70, gx + 92, y + 18, 2, seed + k)); } sketch(paths, p, { w: 6 }); }
function brick(x, y, s, p) { // 3/4 view brick with two holes
  sketch([...box(x, y + 60 * s, 300 * s, 110 * s, 21), ln(x, y + 60 * s, x + 80 * s, y), ln(x + 80 * s, y, x + 380 * s, y), ln(x + 300 * s, y + 60 * s, x + 380 * s, y), ln(x + 380 * s, y, x + 380 * s, y + 110 * s), ln(x + 380 * s, y + 110 * s, x + 300 * s, y + 170 * s),
    circ(x + 140 * s, y + 30 * s, 30 * s, 12 * s, 0, 6.6, 5), circ(x + 260 * s, y + 30 * s, 30 * s, 12 * s, 0, 6.6, 6)], p, { w: 7 });
}

function s1(lt, t) { // Can you take an AI for a walk? I tried.
  write('Can you take', 90, 400, 132, (t - .1) / .6); write('an AI for', 90, 545, 132, (t - .55) / .5); write('a walk?', 90, 690, 132, (t - .95) / .5);
  const walking = t > at(1), ph = walking ? (t - at(1)) * 7 : undefined;
  sketch([ln(60, 1330, 1000, 1336, 3, 2)], (t - .3) / .6, { w: 6 });
  tac(640, 1322, 1.05, { p: (t - .35) / 1.2, walk: ph, look: [-.6, -.2], leash: [[400, 1000], [160, 880], [-20, 830]], leashP: (t - 1.3) / .5 });
  if (walking) for (let k = 0; k < 3; k++) { const u = ((t - at(1)) * 1.6 + k / 3) % 1; lx.save(); lx.globalAlpha = (1 - u) * .7; lx.strokeStyle = C.chalk; lx.lineWidth = 4;
    lx.beginPath(); lx.arc(560 - u * 140, 1310 - u * 30, 10 + u * 22, 0, 7); lx.stroke(); lx.restore(); }
}
function s2(lt, t) { // Stanford: walking made 81% more creative, even on a treadmill facing a blank wall
  note('A STANFORD STUDY', 90, 290, 54, (t - at(2)) / .5);
  write('81%', 90, 560, 290, (t - at(3) - .5) / .6);
  note('of people got more creative', 90, 650, 56, (t - at(3) - 1.2) / .6); note('while walking', 90, 715, 56, (t - at(3) - 1.6) / .4);
  const a = at(4), ph = t > a ? (t - a) * 6 : 0, sw = Math.sin(ph) * .5;
